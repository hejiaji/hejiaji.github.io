<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Page not found — Jeremy He">
    <meta name="google-site-verification" content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI" />
    <link rel="shortcut icon" href="/img/favicon.ico">
    <title>404 — Jeremy He</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f9f9f7;
            --text: #1a1a1a;
            --muted: #888;
            --accent: #2563eb;
            --border: #e5e5e5;
            --toggle-bg: #e5e5e5;
            --toggle-text: #555;
        }

        :root[data-theme="dark"] {
            --bg: #111110;
            --text: #e8e8e6;
            --muted: #666;
            --accent: #60a5fa;
            --border: #2a2a28;
            --toggle-bg: #2a2a28;
            --toggle-text: #999;
        }

        html { font-size: 16px; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .container {
            text-align: center;
            padding: 24px;
        }

        .code {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--border);
            line-height: 1;
            margin-bottom: 16px;
            user-select: none;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 32px;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 20px;
            transition: border-color 0.15s, color 0.15s;
        }

        .home-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .home-link svg {
            width: 15px;
            height: 15px;
        }

        /* theme toggle */
        .ctrl-btn {
            position: fixed;
            top: 14px;
            right: 24px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--toggle-bg);
            color: var(--toggle-text);
            border: none;
            border-radius: 6px;
            padding: 5px 11px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            font-family: inherit;
        }
        .ctrl-btn:hover { color: var(--text); }
        .ctrl-btn svg { width: 14px; height: 14px; }
    </style>
</head>
<body>

<button class="ctrl-btn" onclick="toggleTheme()">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <span id="themeLabel">Dark</span>
</button>

<div class="container">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="home-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back to home
    </a>
</div>

<script>
    const root = document.documentElement;
    const themeLabel = document.getElementById('themeLabel');
    const themeIcon = document.getElementById('themeIcon');

    const sunIcon = `<path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/><circle cx="12" cy="12" r="5"/>`;
    const moonIcon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;

    const savedTheme = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        themeIcon.innerHTML = theme === 'dark' ? sunIcon : moonIcon;
        themeLabel.textContent = theme === 'dark' ? 'Light' : 'Dark';
        localStorage.setItem('theme', theme);
    }

    function toggleTheme() {
        applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
</script>

</body>
</html>
